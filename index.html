<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="AIFlow Studio - AI-powered business automation platform"
  >

  <title>AIFlow Studio</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >

</head>


<body>


  <!-- MOBILE MENU -->

  <button
    id="mobileMenu"
    class="mobile-menu"
    aria-label="Open navigation"
  >
    ☰
  </button>


  <!-- SIDEBAR -->

  <aside id="sidebar">

    <div class="brand">
      ✦ AIFlow
    </div>


    <nav>

      <button
        class="nav-button"
        data-page="overview"
      >
        <span>⌂</span>
        <span>Overview</span>
      </button>


      <button
        class="nav-button"
        data-page="chat"
      >
        <span>◉</span>
        <span>AI Chat</span>
      </button>


      <button
        class="nav-button"
        data-page="leads"
      >
        <span>♢</span>
        <span>Leads</span>
      </button>


      <button
        class="nav-button"
        data-page="automations"
      >
        <span>⚡</span>
        <span>Automations</span>
      </button>


      <button
        class="nav-button"
        data-page="analytics"
      >
        <span>▥</span>
        <span>Analytics</span>
      </button>

    </nav>


    <div class="pro">

      <small>
        PRO WORKSPACE
      </small>

      <strong>
        AI Automation Suite
      </strong>

      <small>
        Ready for clients
      </small>

    </div>

  </aside>


  <!-- MAIN -->

  <main>

    <header>

      <div>

        <small>
          AI AUTOMATION PLATFORM
        </small>

        <h1 id="title">
          Good evening, Redouane.
        </h1>

      </div>


      <div class="system-status">
        ● All systems operational
      </div>

    </header>


    <section id="content"></section>

  </main>


  <script src="/app.js"></script>

</body>

</html>
